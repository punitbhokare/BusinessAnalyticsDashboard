
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Business Analytics Dashboard</title>

    <!-- Plotly Charts -->
    <script src="https://cdn.plot.ly/plotly-3.0.1.min.js"></script>

    <!-- Dashboard Styling -->
    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <header>
        <h1>Business Analytics Dashboard</h1>
        <p>Analyze your business performance</p>
    </header>

    <main>

        <!-- CSV Upload Section -->
        <section class="upload-box">
            <h2>Upload Sales Dataset</h2>

            <p>Select your business sales CSV file below.</p>

            <div class="upload-controls">
                <input
                    type="file"
                    id="csvFile"
                    accept=".csv"
                >

                <button type="button" onclick="uploadFile()">
                    Upload CSV
                </button>
            </div>

            <p id="message" role="status">
                No dataset uploaded yet.
            </p>
        </section>

        <!-- KPI Cards -->
        <section class="kpi-container">

            <div class="kpi-card">
                <h3>Total Sales</h3>
                <p id="sales">₹0</p>
            </div>

            <div class="kpi-card">
                <h3>Total Profit</h3>
                <p id="profit">₹0</p>
            </div>

            <div class="kpi-card">
                <h3>Total Orders</h3>
                <p id="orders">0</p>
            </div>

            <div class="kpi-card">
                <h3>Average Order Value</h3>
                <p id="average">₹0</p>
            </div>

        </section>

        <!-- Charts -->
        <section class="charts">

            <div class="chart-box">
                <div id="salesChart"></div>
            </div>

            <div class="chart-box">
                <div id="categoryChart"></div>
            </div>

        </section>

    </main>

    <!-- CSV Parser -->
    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.5.3/papaparse.min.js"></script>

    <!-- Dashboard JavaScript -->
    <script src="{{ url_for('static', filename='script.js') }}"></script>

</body>
</html>
